<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AEN Network Demo</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      padding: 24px;
      background-color: #f8fafc;
      color: #0f172a;
    }
    .container {
      max-width: 480px;
      margin: 0 auto;
    }
    h1 { font-size: 20px; }
    p { color: #64748b; font-size: 14px; line-height: 1.5; }
    .widget-container { margin-top: 24px; }
  </style>
  <!-- Load your live custom widget script -->
  <script src="./widget.js"></script>
</head>
<body>
  <div class="container">
    <h1>IconCraft App Dashboard</h1>
    <p>This demo page simulates IconCraft using its API key (<code>design_key_202</code>) to embed a partner cross-promotion.</p>
    
    <div class="widget-container">
      <!-- The custom HTML tag that powers the network -->
      <aen-widget api-key="design_key_202"></aen-widget>
    </div>
  </div>
</body>
</html>

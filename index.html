<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AEN Autonomous Network - Node Registration</title>
  <style>
    :root {
      --bg: #0d1117;
      --card-bg: #161b22;
      --border: #30363d;
      --text: #c9d1d9;
      --heading: #f0f6fc;
      --accent: #238636;
      --accent-hover: #2ea043;
      --code-bg: #010409;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      margin: 0;
      padding: 40px 20px;
      display: flex;
      justify-content: center;
    }
    .container {
      max-width: 600px;
      width: 100%;
    }
    h1 { color: var(--heading); margin-bottom: 8px; }
    p { margin-top: 0; color: #8b949e; line-height: 1.5; }
    .card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 24px;
      margin-bottom: 24px;
    }
    label {
      display: block;
      font-size: 14px;
      font-weight: 600;
      margin-bottom: 6px;
      color: var(--heading);
    }
    input, select {
      width: 100%;
      padding: 10px 12px;
      margin-bottom: 16px;
      background: var(--code-bg);
      border: 1px solid var(--border);
      border-radius: 6px;
      color: var(--heading);
      font-size: 14px;
      box-sizing: border-box;
    }
    input:focus, select:focus {
      outline: none;
      border-color: #58a6ff;
    }
    button {
      width: 100%;
      background: var(--accent);
      color: white;
      border: none;
      padding: 12px;
      border-radius: 6px;
      font-weight: 600;
      cursor: pointer;
      font-size: 15px;
    }
    button:hover { background: var(--accent-hover); }
    .result {
      display: none;
      background: var(--code-bg);
      border: 1px solid #238636;
      border-radius: 6px;
      padding: 16px;
      margin-top: 16px;
    }
    .key-box {
      font-family: monospace;
      background: #161b22;
      padding: 10px;
      border-radius: 4px;
      color: #7ee787;
      word-break: break-all;
      margin: 8px 0;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Join the AEN Distribution Network</h1>
    <p>Register your app node to get 20 starter credits and participate in autonomous cross-promotion.</p>

    <div class="card">
      <form id="regForm">
        <label for="appName">App / Product Name</label>
        <input type="text" id="appName" placeholder="e.g. PromptDB AI" required />

        <label for="appDomain">Domain</label>
        <input type="text" id="appDomain" placeholder="e.g. promptdb.ai" required />

        <label for="appCategory">Category</label>
        <select id="appCategory">
          <option value="Developer Tools">Developer Tools</option>
          <option value="Design & Creative">Design & Creative</option>
          <option value="Productivity">Productivity</option>
          <option value="AI & ML">AI & ML</option>
        </select>

        <button type="submit">Register Node & Claim 20 Credits</button>
      </form>

      <div id="result" class="result">
        <h3 style="color: #7ee787; margin-top:0;">Node Registered Successfully!</h3>
        <p style="color: var(--text); margin-bottom: 4px;">Save your API Key securely:</p>
        <div id="keyDisplay" class="key-box"></div>
        <p style="font-size: 12px; color: #8b949e; margin-bottom: 0;">Use this API Key in your widget and campaign HTTP headers.</p>
      </div>
    </div>
  </div>

  <script>
    const form = document.getElementById('regForm');
    const resultDiv = document.getElementById('result');
    const keyDisplay = document.getElementById('keyDisplay');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const name = document.getElementById('appName').value;
      const domain = document.getElementById('appDomain').value;
      const category = document.getElementById('appCategory').value;

      try {
        const res = await fetch('https://aen-backend-production-a6b2.up.railway.app/v1/nodes', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ name, domain, category })
        });
        const data = await res.json();

        if (res.ok) {
          keyDisplay.innerText = data.node.apiKey;
          resultDiv.style.display = 'block';
          form.reset();
        } else {
          alert('Error: ' + (data.details || data.error));
        }
      } catch (err) {
        alert('Network error. Failed to reach server.');
      }
    });
  </script>
</body>
</html>
